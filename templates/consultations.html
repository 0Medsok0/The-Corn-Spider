<!DOCTYPE html>
<html>
<head>
    <title>Консультации</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <h1>Консультации</h1>
    <a href="{{ url_for('add_consultation') }}">Добавить консультацию</a>
    <table>
        <tr>
            <th>Пациент</th>
            <th>Врач</th>
            <th>Дата</th>
        </tr>
        {% for consultation in consultations %}
        <tr>
            <td>{{ consultation.patient_id }}</td>
            <td>{{ consultation.doctor_id }}</td>
            <td>{{ consultation.date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
