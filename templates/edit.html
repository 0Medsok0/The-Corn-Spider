<!DOCTYPE html>
<html>
<head>
    <title>Редактировать пациента</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='edit.css') }}">
</head>
<body>
    <h1>Редактировать пациента</h1>
    <form method="POST" action="{{ url_for('edit_patient', id=patient.id) }}">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" value="{{ patient.name }}" required>
        <br>
        <label for="age">Возраст:</label>
        <input type="number" id="age" name="age" value="{{ patient.age }}" required>
        <br>
        <label for="gender">Пол:</label>
        <select id="gender" name="gender" required>
            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Мужской</option>
            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Женский</option>
        </select>
        <br>
        <input type="submit" value="Сохранить изменения">
    </form>
</body>
</html>
