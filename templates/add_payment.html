<!DOCTYPE html>
<html>
<head>
    <title>Добавить платеж</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='add_payment.css') }}">

</head>
<body>
    <h1>Добавить платеж</h1>
    <form method="POST" action="{{ url_for('add_payment') }}">
        <label for="patient_id">Идентификатор пациента:</label>
        <input type="number" id="patient_id" name="patient_id" required>
        <br>
        <label for="amount">Сумма:</label>
        <input type="number" id="amount" name="amount" required>
        <br>
        <label for="date">Дата:</label>
        <input type="datetime-local" id="date" name="date" required>
        <br>
        <input type="submit" value="Добавить платеж">
    </form>
</body>
</html>
